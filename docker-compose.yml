services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: mercado_fresco_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: frescos
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mercado_fresco_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mercado_fresco_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=frescos
    depends_on:
      - mysql
    networks:
      - mercado_fresco_network
    volumes:
      - ./config.yml:/app/config.yml

networks:
  mercado_fresco_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local